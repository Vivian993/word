<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>圖示產生器</title>
<!-- 📌 iPhone 桌面 App 圖示：它會去抓您上傳到 GitHub 的 custom-icon.png 照片 -->
<link rel="apple-touch-icon" href="custom-icon.png" <link rel="icon" type="image/png" href="custom-icon.png"  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f3eedd;
    --paper-alt: #ece4cd;
    --ink: #2c2b26;
    --ink-soft: #5b564a;
    --red: #b4483a;
    --red-soft: #c97365;
    --blue: #7fa0b8;
    --blue-faint: rgba(127,160,184,0.35);
    --gold: #c2953f;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(196,158,90,0.10), transparent 55%),
      var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:28px 18px 60px;
  }
  .wrap{ max-width:420px; margin:0 auto; }

  header{
    padding:0 2px 20px 18px;
    margin-bottom:22px;
    border-left:3px solid var(--red);
  }
  .eyebrow{
    font-family:'Ma Shan Zheng', cursive;
    font-size:19px;
    color:var(--red-soft);
    display:block;
    margin-bottom:2px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:24px;
    margin:0 0 6px;
  }
  header p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.7;
  }

  .canvas-wrap{
    width:100%;
    aspect-ratio:1/1;
    border-radius:22%;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(44,43,38,0.18);
    margin-bottom:22px;
  }
  #iconCanvas{ width:100%; height:100%; display:block; }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input[type="text"]{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1.5px solid var(--blue-faint);
    background:#fbf8ef;
    font-size:20px;
    font-family:'Noto Serif TC', serif;
    color:var(--ink);
    text-align:center;
  }
  .field input[type="text"]:focus{ outline:none; border-color:var(--gold); }
  .hint-small{ font-size:11px; color:var(--ink-soft); margin-top:6px; text-align:center; }

  .swatch-row{ display:flex; gap:10px; justify-content:center; margin-bottom:22px; }
  .swatch{
    width:32px; height:32px; border-radius:50%;
    cursor:pointer; border:2px solid transparent;
  }
  .swatch.selected{ border-color:var(--ink); box-shadow:0 0 0 2px var(--paper); }

  .btn{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    background:var(--red);
    color:#fdf9ef;
  }
  .btn:active{ transform:scale(0.98); }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">自己填字・自己產生</span>
      <h1>圖示產生器</h1>
      <p>輸入 1～4 個字，就會即時做出同款的田字格圖示，做好可以直接下載存成圖片。</p>
    </header>

    <div class="canvas-wrap">
      <canvas id="iconCanvas" width="1024" height="1024"></canvas>
    </div>

    <div class="field">
      <label for="charInput">要顯示的文字</label>
      <input id="charInput" type="text" maxlength="4" placeholder="例如：成語" value="成語">
      <div class="hint-small">建議 1～4 個字，太多字會自動縮小</div>
    </div>

    <div class="swatch-row" id="swatchRow"></div>

    <button class="btn" id="downloadBtn">下載這張圖示</button>
  </div>

<script>
const COLORS = ['#7fa0b8','#b4483a','#c2953f','#6e8f6a','#a3688f','#5b564a'];
let selectedBorder = COLORS[0];

const canvas = document.getElementById('iconCanvas');
const ctx = canvas.getContext('2d');
const input = document.getElementById('charInput');
const SIZE = 1024;

function hexToRgba(hex, alpha){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function draw(){
  const text = (input.value || '字').trim() || '字';

  // background paper
  ctx.clearRect(0,0,SIZE,SIZE);
  ctx.fillStyle = '#f3eedd';
  ctx.fillRect(0,0,SIZE,SIZE);

  // soft radial glow top-left
  const grad = ctx.createRadialGradient(250,250,0,250,250,700);
  grad.addColorStop(0, 'rgba(196,158,90,0.14)');
  grad.addColorStop(1, 'rgba(196,158,90,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,SIZE,SIZE);

  const margin = 90;
  const left = margin, top = margin, right = SIZE - margin, bottom = SIZE - margin;
  const cx = SIZE/2, cy = SIZE/2;
  const radius = 60;

  // rounded rect border
  ctx.lineWidth = 14;
  ctx.strokeStyle = selectedBorder;
  roundRectPath(left, top, right-left, bottom-top, radius);
  ctx.stroke();

  // cross guide lines
  ctx.lineWidth = 6;
  ctx.strokeStyle = hexToRgba(selectedBorder, 0.55);
  ctx.beginPath();
  ctx.moveTo(cx, top+20); ctx.lineTo(cx, bottom-20);
  ctx.moveTo(left+20, cy); ctx.lineTo(right-20, cy);
  ctx.stroke();

  // red margin line
  ctx.lineWidth = 10;
  ctx.strokeStyle = '#b4483a';
  ctx.beginPath();
  const redX = left + 70;
  ctx.moveTo(redX, top+10); ctx.lineTo(redX, bottom-10);
  ctx.stroke();

  // text, auto-fit
  const n = text.length;
  let fontSize = n <= 1 ? 560 : (n === 2 ? 400 : (n === 3 ? 300 : 250));
  const innerW = (right-left) - 140;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#2c2b26';

  let measured;
  do{
    ctx.font = `900 ${fontSize}px 'Noto Serif TC', serif`;
    measured = ctx.measureText(text).width;
    if(measured <= innerW || fontSize <= 100) break;
    fontSize -= 8;
  } while(true);

  ctx.font = `900 ${fontSize}px 'Noto Serif TC', serif`;
  ctx.fillText(text, cx, cy + fontSize*0.03);
}

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function buildSwatches(){
  const row = document.getElementById('swatchRow');
  row.innerHTML = '';
  COLORS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === selectedBorder ? ' selected' : '');
    s.style.background = c;
    s.addEventListener('click', () => { selectedBorder = c; buildSwatches(); draw(); });
    row.appendChild(s);
  });
}

input.addEventListener('input', draw);

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = (input.value || '字').trim() || '字';
  const link = document.createElement('a');
  link.download = text + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// wait for font to load before first draw
if(document.fonts && document.fonts.ready){
  document.fonts.load("900 560px 'Noto Serif TC'").then(() => {
    buildSwatches();
    draw();
  }).catch(() => { buildSwatches(); draw(); });
} else {
  buildSwatches();
  draw();
}
</script>
</body>
</html>
