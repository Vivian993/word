<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>填字貼圖產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/earlyaccess/cwtexyen.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/earlyaccess/cwtexkai.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/earlyaccess/cwtexming.css">
<style>
  :root{
    --paper: #f3eedd;
    --ink: #2c2b26;
    --ink-soft: #5b564a;
    --red: #b4483a;
    --gold: #c2953f;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(196,158,90,0.10), transparent 55%),
      var(--paper);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:26px 18px 60px;
  }
  .wrap{ max-width:420px; margin:0 auto; }

  header{
    padding:0 2px 18px 16px;
    margin-bottom:20px;
    border-left:3px solid var(--red);
  }
  .eyebrow{
    font-family:'Ma Shan Zheng', cursive;
    font-size:18px;
    color:#c97365;
    display:block;
    margin-bottom:2px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:22px;
    margin:0 0 5px;
  }
  header p{
    margin:0;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.7;
  }

  .tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:16px;
  }
  .tab{
    padding:9px 4px;
    border-radius:9px;
    border:1.5px solid rgba(44,43,38,0.12);
    background:#fbf8ef;
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    text-align:center;
    cursor:pointer;
    line-height:1.4;
  }
  .tab.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  .canvas-wrap{
    width:100%;
    aspect-ratio:1/1;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(44,43,38,0.18);
    margin-bottom:20px;
    background:#fff;
  }
  #iconCanvas{ width:100%; height:100%; display:block; touch-action:none; cursor:grab; }

  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input[type="text"]{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1.5px solid rgba(127,160,184,0.35);
    background:#fbf8ef;
    font-size:20px;
    font-family:'Noto Serif TC', serif;
    color:var(--ink);
    text-align:center;
  }
  .field input[type="text"]:focus{ outline:none; border-color:var(--gold); }
  .hint-small{ font-size:11px; color:var(--ink-soft); margin-top:6px; text-align:center; }

  .section-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }

  .font-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:16px;
    padding-bottom:2px;
  }
  .font-chip{
    flex:0 0 auto;
    padding:10px 14px;
    border-radius:10px;
    border:1.5px solid rgba(44,43,38,0.12);
    background:#fbf8ef;
    font-size:17px;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .font-chip.selected{
    border-color:var(--ink);
    background:var(--ink);
    color:var(--paper);
  }

  .swatch-row{ display:flex; gap:9px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
  .swatch{
    width:30px; height:30px; border-radius:50%;
    cursor:pointer; border:2px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  }
  .swatch.selected{ border-color:var(--ink); box-shadow:0 0 0 2px var(--paper); }
  .swatch.text-swatch{ box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }

  .btn-row{ display:flex; gap:10px; margin-top:4px; }
  .btn{
    flex:1;
    padding:14px;
    border-radius:10px;
    border:none;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .btn-primary{ background:var(--red); color:#fdf9ef; }
  .btn-secondary{ background:#fbf8ef; color:var(--ink); border:1.5px solid rgba(44,43,38,0.15); }
  .btn:active{ transform:scale(0.98); }

  #statusMsg{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:10px;
    min-height:16px;
  }

  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">自己填字・自己產生</span>
      <h1>填字貼圖產生器</h1>
      <p>選樣式、選字體、選顏色，輸入 1～4 個字即時產生貼圖，完成後下載存成 PNG。</p>
    </header>

    <div class="tabs" id="tabRow"></div>

    <div class="canvas-wrap">
      <canvas id="iconCanvas" width="1024" height="1024"></canvas>
    </div>
    <div class="hint-small" style="margin:-14px 0 18px;">👆 直接在圖上拖曳文字可以移動位置　·　<span id="resetPosBtn" style="text-decoration:underline; cursor:pointer;">重設位置與大小</span></div>

    <div id="uploadSection" style="display:none;">
      <div class="btn-row" style="margin-bottom:14px;">
        <button class="btn btn-secondary" id="uploadBtn">上傳圖片</button>
        <button class="btn btn-secondary" id="removeImgBtn">移除圖片</button>
      </div>
      <input type="file" id="imageInput" accept="image/*" style="display:none;">

      <div class="tabs" style="grid-template-columns:repeat(2,1fr); margin-bottom:10px;">
        <div class="tab active" id="dragTextTab">拖曳文字</div>
        <div class="tab" id="dragImageTab">拖曳照片</div>
      </div>
      <div class="section-label">圖片縮放</div>
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
        <input type="range" id="imgZoomSlider" min="1" max="3" step="0.05" value="1" style="flex:1;">
        <span id="imgZoomValue" style="font-size:12px; color:var(--ink-soft); width:42px; text-align:right;">100%</span>
      </div>
    </div>

    <div class="field">
      <label for="charInput">要顯示的文字</label>
      <input id="charInput" type="text" maxlength="4" placeholder="例如：成語" value="成語">
      <div class="hint-small">建議 1～4 個字，太多字會自動縮小</div>
    </div>

    <div class="section-label">字體</div>
    <div class="font-row" id="fontRow"></div>

    <div class="section-label">文字大小</div>
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <input type="range" id="sizeSlider" min="0.5" max="2.5" step="0.05" value="1" style="flex:1;">
      <span id="sizeValue" style="font-size:12px; color:var(--ink-soft); width:42px; text-align:right;">100%</span>
    </div>

    <div class="section-label">文字排列</div>
    <div class="tabs" id="layoutRow" style="grid-template-columns:repeat(2,1fr); margin-bottom:16px;">
      <div class="tab active" id="oneLineTab">單排</div>
      <div class="tab" id="twoLineTab">上下兩排</div>
    </div>

    <div class="section-label">文字顏色</div>
    <div class="swatch-row" id="textColorRow"></div>

    <div class="section-label">主色調</div>
    <div class="swatch-row" id="swatchRow"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="downloadBtn">下載 PNG</button>
      <button class="btn btn-secondary" id="openBtn">預覽並儲存</button>
    </div>
    <div id="statusMsg"></div>
  </div>

  <div id="imgModal" style="display:none; position:fixed; inset:0; background:rgba(15,14,12,0.94); z-index:9999; flex-direction:column; align-items:center; justify-content:center; padding:24px;">
    <button id="closeModalBtn" aria-label="關閉" style="position:absolute; top:18px; right:18px; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,0.14); color:#fff; font-size:20px; cursor:pointer;">✕</button>
    <img id="modalImg" style="max-width:100%; max-height:72vh; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
    <div style="color:#f3eedd; font-size:13px; margin-top:18px; text-align:center; line-height:1.7;">長按（或右鍵）圖片即可儲存到相簿<br>點右上角 ✕ 直接關閉，不會離開這個頁面</div>
  </div>

<script>
const canvas = document.getElementById('iconCanvas');
const ctx = canvas.getContext('2d');
const input = document.getElementById('charInput');
const statusMsg = document.getElementById('statusMsg');
const SIZE = 1024;

/* ---------- fonts (all verified to support full Traditional Chinese glyph sets) ---------- */
const FONTS = {
  serif:  { label:'思源宋體', family:"'Noto Serif TC'", weight:900 },
  ming:   { label:'細明體',   family:"'cwTeXMing'",     weight:400 },
  sans:   { label:'思源黑體', family:"'Noto Sans TC'",  weight:700 },
  kai2:   { label:'書法行楷', family:"'cwTeXKai'",      weight:400 },
  kai:    { label:'手寫楷體', family:"'LXGW WenKai TC'", weight:400 },
  yen:    { label:'圓潤可愛', family:"'cwTeXYen'",       weight:400 },
  wawa:   { label:'娃娃體',   family:"'Noto Sans TC'",  weight:900, bubble:true }
};
let selectedFontKey = 'serif';

/* ---------- template + accent-color definitions ---------- */
const TEMPLATES = {
  grid:   { label:'田字格',   colors:['#7fa0b8','#b4483a','#c2953f','#6e8f6a','#a3688f','#5b564a'] },
  circle: { label:'圓形莫蘭迪', colors:['#a8b5a0','#d4a5a5','#9db4c0','#d9c5a0','#b8a0ac','#c48b7f'] },
  cover:  { label:'課本封面', colors:['#e7c9a0','#c3d4c9','#e2b8b8','#c7d1e0','#e6d2a8','#cfc2d9'] },
  stamp:  { label:'貼紙印章', colors:['#e0836f','#7bb0a0','#e8b23a','#7594c9','#c179a8','#4f9d7a'] },
  washi:  { label:'撕邊紙標', colors:['#c9a86b','#a8907a','#9fae8a','#c48d75','#8a9db0','#b08fa0'] },
  emblem: { label:'徽章勳標', colors:['#b4483a','#2f6f5e','#1f4e79','#7a4a8c','#a8781f','#3a3a3a'] },
  photo:  { label:'相片手札', colors:['#c9a86b','#7bb0a0','#e0836f','#7594c9','#c2953f','#b8a0ac'] }
};
const TEXT_COLORS = ['#2c2b26','#fdf9ef','#b4483a','#2f5d8a','#c2953f','#4f6f52'];

let currentTemplate = 'grid';
let selectedColor = TEMPLATES.grid.colors[0];
let selectedTextColor = TEXT_COLORS[0];
let uploadedImage = null;
let textOffsetX = 0, textOffsetY = 0;
let textScale = 1;
let imageScale = 1, imageOffsetX = 0, imageOffsetY = 0;
let dragTarget = 'text'; // 'text' | 'image' — only relevant for the photo template
let twoLineMode = false;

function hexToRgba(hex, alpha){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function lighten(hex, amt){
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amt);
  return `rgb(${r},${g},${b})`;
}
function darken(hex, amt){
  const r = Math.max(0, parseInt(hex.slice(1,3),16) - amt);
  const g = Math.max(0, parseInt(hex.slice(3,5),16) - amt);
  const b = Math.max(0, parseInt(hex.slice(5,7),16) - amt);
  return `rgb(${r},${g},${b})`;
}
function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function fitText(text, maxWidth, startSize, minSize, weight, family){
  let size = startSize, w;
  do{
    ctx.font = `${weight} ${size}px ${family}`;
    w = ctx.measureText(text).width;
    if(w <= maxWidth || size <= minSize) break;
    size -= 6;
  } while(true);
  return size;
}
// deterministic pseudo-random (stable across redraws)
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function currentFont(){ return FONTS[selectedFontKey]; }

// shared washi-tape decoration used by multiple templates
function drawTapeStrip(cx,cy,rot,tw,th,col){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.fillStyle=hexToRgba(col,0.55);
  ctx.fillRect(-tw/2,-th/2,tw,th);
  ctx.fillStyle=hexToRgba('#ffffff',0.18);
  for(let x=-tw/2; x<tw/2; x+=18){ ctx.fillRect(x,-th/2,3,th); }
  ctx.restore();
}
// cover-fit an image into a rounded-rect frame
function drawImageCover(img, dx, dy, dw, dh, radius){
  ctx.save();
  roundRectPath(dx, dy, dw, dh, radius);
  ctx.clip();
  const scale = Math.max(dw/img.width, dh/img.height);
  const iw = img.width*scale, ih = img.height*scale;
  ctx.drawImage(img, dx+(dw-iw)/2, dy+(dh-ih)/2, iw, ih);
  ctx.restore();
}
// cover-fit an image with extra user zoom + pan offset (no rounding — for full-bleed use)
function drawImageCoverZoom(img, dx, dy, dw, dh, zoom, offX, offY){
  ctx.save();
  ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
  const baseScale = Math.max(dw/img.width, dh/img.height);
  const scale = baseScale * zoom;
  const iw = img.width*scale, ih = img.height*scale;
  ctx.drawImage(img, dx+(dw-iw)/2+offX, dy+(dh-ih)/2+offY, iw, ih);
  ctx.restore();
}

function isLightColor(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b) > 175;
}
// shared text renderer: handles auto-fit sizing and the 娃娃體 bubble outline effect
function drawStyledText(text, cx, cy, innerW, base, min){
  const f = currentFont();
  const x = cx + textOffsetX;

  if(twoLineMode && text.length > 1){
    const half = Math.ceil(text.length/2);
    const line1 = text.slice(0, half), line2 = text.slice(half);
    const fs1 = fitText(line1, innerW, base*0.62, Math.max(min*0.6,40), f.weight, f.family);
    const fs2 = fitText(line2, innerW, base*0.62, Math.max(min*0.6,40), f.weight, f.family);
    const fs = Math.min(fs1, fs2) * textScale;
    ctx.font = `${f.weight} ${fs}px ${f.family}`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const lineGap = fs*1.1;
    const y1 = cy + textOffsetY - lineGap/2;
    const y2 = cy + textOffsetY + lineGap/2;
    if(f.bubble){
      ctx.lineJoin='round'; ctx.miterLimit=2;
      ctx.lineWidth = fs*0.17;
      ctx.strokeStyle = isLightColor(selectedTextColor) ? '#2c2b26' : '#ffffff';
      ctx.strokeText(line1, x, y1);
      ctx.strokeText(line2, x, y2);
    }
    ctx.fillStyle = selectedTextColor;
    ctx.fillText(line1, x, y1);
    ctx.fillText(line2, x, y2);
    return fs;
  }

  const fitted = fitText(text, innerW, base, min, f.weight, f.family);
  const fs = fitted * textScale;
  ctx.font = `${f.weight} ${fs}px ${f.family}`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const y = cy + textOffsetY + fs*0.03;
  if(f.bubble){
    ctx.lineJoin='round'; ctx.miterLimit=2;
    ctx.lineWidth = fs*0.17;
    ctx.strokeStyle = isLightColor(selectedTextColor) ? '#2c2b26' : '#ffffff';
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = selectedTextColor;
  ctx.fillText(text, x, y);
  return fs;
}

/* ---------- 1. 田字格 textbook grid ---------- */
function drawGrid(text){
  const f = currentFont();
  ctx.fillStyle = '#f3eedd'; ctx.fillRect(0,0,SIZE,SIZE);
  const grad = ctx.createRadialGradient(250,250,0,250,250,700);
  grad.addColorStop(0,'rgba(196,158,90,0.14)'); grad.addColorStop(1,'rgba(196,158,90,0)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,SIZE,SIZE);

  const margin=90, left=margin, top=margin, right=SIZE-margin, bottom=SIZE-margin, cx=SIZE/2, cy=SIZE/2;

  ctx.lineWidth=14; ctx.strokeStyle=selectedColor;
  roundRectPath(left, top, right-left, bottom-top, 60); ctx.stroke();

  ctx.lineWidth=6; ctx.strokeStyle=hexToRgba(selectedColor,0.55);
  ctx.beginPath();
  ctx.moveTo(cx, top+20); ctx.lineTo(cx, bottom-20);
  ctx.moveTo(left+20, cy); ctx.lineTo(right-20, cy);
  ctx.stroke();

  ctx.lineWidth=10; ctx.strokeStyle='#b4483a';
  ctx.beginPath();
  const redX=left+70; ctx.moveTo(redX, top+10); ctx.lineTo(redX, bottom-10); ctx.stroke();

  const n=text.length;
  let base = n<=1?560:(n===2?400:(n===3?300:250));
  const innerW=(right-left)-140;
  drawStyledText(text, cx, cy, innerW, base, 100);
}

/* ---------- 2. 圓形莫蘭迪 scalloped circle badge ---------- */
function drawCircle(text){
  const f = currentFont();
  ctx.fillStyle='#fbf8f2'; ctx.fillRect(0,0,SIZE,SIZE);
  const cx=SIZE/2, cy=SIZE/2, R=420;

  const bumps=18;
  ctx.beginPath();
  for(let i=0;i<bumps;i++){
    const a0=(i/bumps)*Math.PI*2, a1=((i+1)/bumps)*Math.PI*2, amid=(a0+a1)/2, rOuter=R+34;
    if(i===0) ctx.moveTo(cx+R*Math.cos(a0), cy+R*Math.sin(a0));
    ctx.quadraticCurveTo(cx+rOuter*Math.cos(amid), cy+rOuter*Math.sin(amid), cx+R*Math.cos(a1), cy+R*Math.sin(a1));
  }
  ctx.closePath();
  ctx.fillStyle=lighten(selectedColor,55); ctx.fill();

  ctx.beginPath(); ctx.arc(cx,cy,R-30,0,Math.PI*2);
  ctx.fillStyle=selectedColor; ctx.fill();

  const hi=ctx.createRadialGradient(cx-120,cy-140,10,cx-120,cy-140,420);
  hi.addColorStop(0,'rgba(255,255,255,0.35)'); hi.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(cx,cy,R-30,0,Math.PI*2); ctx.fillStyle=hi; ctx.fill();

  ctx.fillStyle='rgba(255,255,255,0.5)';
  const dots=28;
  for(let i=0;i<dots;i++){
    const a=(i/dots)*Math.PI*2, dx=cx+(R-70)*Math.cos(a), dy=cy+(R-70)*Math.sin(a);
    ctx.beginPath(); ctx.arc(dx,dy,4,0,Math.PI*2); ctx.fill();
  }

  const n=text.length;
  let base = n<=1?420:(n===2?300:(n===3?230:190));
  const innerW=(R-30)*2-160;
  drawStyledText(text, cx, cy, innerW, base, 80);
}

/* ---------- 3. 課本封面 textbook cover ---------- */
function drawCover(text){
  const f = currentFont();
  ctx.fillStyle='#fbf8f2'; ctx.fillRect(0,0,SIZE,SIZE);
  const margin=80, left=margin, top=margin, right=SIZE-margin, bottom=SIZE-margin, w=right-left, h=bottom-top;

  roundRectPath(left, top, w, h, 28);
  ctx.fillStyle='#ffffff'; ctx.fill();
  ctx.strokeStyle='rgba(44,43,38,0.10)'; ctx.lineWidth=3; ctx.stroke();

  const bandH=h*0.42;
  ctx.save();
  roundRectPath(left, top, w, bandH, 28); ctx.clip();
  ctx.fillStyle=selectedColor; ctx.fillRect(left, top, w, bandH+40);
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=12; ctx.lineJoin='round'; ctx.lineCap='round';
  const bx=left+w/2, by=top+bandH/2+10, bw=180, bh=120;
  ctx.beginPath();
  ctx.moveTo(bx, by-bh*0.35);
  ctx.bezierCurveTo(bx-bw*0.55, by-bh*0.6, bx-bw*0.6, by+bh*0.5, bx-bw*0.05, by+bh*0.4);
  ctx.moveTo(bx, by-bh*0.35);
  ctx.bezierCurveTo(bx+bw*0.55, by-bh*0.6, bx+bw*0.6, by+bh*0.5, bx+bw*0.05, by+bh*0.4);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx, by-bh*0.35); ctx.lineTo(bx, by+bh*0.4); ctx.lineWidth=8; ctx.stroke();
  ctx.restore();

  ctx.beginPath();
  ctx.moveTo(right-150, top); ctx.lineTo(right, top); ctx.lineTo(right, top+150); ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,0.28)'; ctx.fill();

  const stripeY=top+bandH+26;
  ctx.fillStyle=hexToRgba(selectedColor,0.25);
  roundRectPath(left+50, stripeY, w-100, 10, 5); ctx.fill();

  const n=text.length;
  let base = n<=1?340:(n===2?260:(n===3?205:170));
  const innerW=w-110;
  drawStyledText(text, left+w/2, top+bandH+(h-bandH)/2, innerW, base, 90);
}

/* ---------- 4. 貼紙印章 sticker / stamp ---------- */
function drawStamp(text){
  const f = currentFont();
  ctx.fillStyle='#fbf8f2'; ctx.fillRect(0,0,SIZE,SIZE);
  const margin=100, left=margin, top=margin, right=SIZE-margin, bottom=SIZE-margin, w=right-left, h=bottom-top, cx=SIZE/2, cy=SIZE/2;

  ctx.fillStyle=hexToRgba(selectedColor,0.10);
  for(let y=top;y<bottom;y+=46) for(let x=left;x<right;x+=46){ ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill(); }

  roundRectPath(left, top, w, h, 90); ctx.fillStyle=lighten(selectedColor,60); ctx.fill();

  const inset=34;
  ctx.setLineDash([26,18]); ctx.lineWidth=12; ctx.strokeStyle=selectedColor;
  roundRectPath(left+inset, top+inset, w-inset*2, h-inset*2, 70); ctx.stroke();
  ctx.setLineDash([]);

  ctx.save(); ctx.translate(right-10, top-10); ctx.rotate(Math.PI/4);
  ctx.fillStyle=selectedColor; ctx.fillRect(-140,-38,280,76); ctx.restore();
  ctx.save(); ctx.translate(right-118, top+118); ctx.rotate(Math.PI/4);
  ctx.font=`700 34px 'Noto Sans TC'`; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('★', 0, 4); ctx.restore();

  const n=text.length;
  let base = n<=1?460:(n===2?330:(n===3?260:210));
  const innerW=w-220;
  drawStyledText(text, cx, cy, innerW, base, 70);
}

/* ---------- 5. 撕邊紙標 washi tape torn-paper label ---------- */
function drawWashi(text){
  const f = currentFont();
  ctx.fillStyle='#f7f2e6'; ctx.fillRect(0,0,SIZE,SIZE);

  const margin=130, left=margin, top=margin+40, right=SIZE-margin, bottom=SIZE-margin-40, w=right-left, h=bottom-top;
  const rand = mulberry32(7);
  const jag = 22, amp = 14;

  ctx.beginPath();
  // top edge
  for(let i=0;i<=jag;i++){ const x=left+(w*i/jag); const y=top+(rand()-0.5)*amp*2; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  // right edge
  for(let i=0;i<=jag;i++){ const y=top+(h*i/jag); const x=right+(rand()-0.5)*amp*2; ctx.lineTo(x,y); }
  // bottom edge
  for(let i=0;i<=jag;i++){ const x=right-(w*i/jag); const y=bottom+(rand()-0.5)*amp*2; ctx.lineTo(x,y); }
  // left edge
  for(let i=0;i<=jag;i++){ const y=bottom-(h*i/jag); const x=left+(rand()-0.5)*amp*2; ctx.lineTo(x,y); }
  ctx.closePath();

  ctx.save();
  ctx.shadowColor='rgba(44,43,38,0.20)'; ctx.shadowBlur=30; ctx.shadowOffsetY=14;
  ctx.fillStyle=lighten(selectedColor,70); ctx.fill();
  ctx.restore();
  ctx.lineWidth=4; ctx.strokeStyle=hexToRgba(darken(selectedColor,10),0.5); ctx.stroke();

  // fibre texture lines
  ctx.strokeStyle=hexToRgba(selectedColor,0.10); ctx.lineWidth=2;
  for(let i=0;i<40;i++){
    const y=top+rand()*h;
    ctx.beginPath(); ctx.moveTo(left+10, y); ctx.lineTo(right-10, y+ (rand()-0.5)*6); ctx.stroke();
  }

  drawTapeStrip(left+40, top+10, -0.12, 220, 90, selectedColor);
  drawTapeStrip(right-40, bottom-10, -0.12, 220, 90, selectedColor);

  const n=text.length;
  let base = n<=1?400:(n===2?290:(n===3?220:180));
  const innerW=w-200;
  const fs=drawStyledText(text, left+w/2, top+h/2, innerW, base, 70);

  ctx.font=`500 30px 'Noto Sans TC'`; ctx.fillStyle=hexToRgba('#2c2b26',0.45);
  ctx.fillText('hand made label', left+w/2, top+h/2+fs/2+50);
}

/* ---------- 6. 徽章勳標 sunburst emblem ---------- */
function drawEmblem(text){
  const f = currentFont();
  ctx.fillStyle='#faf7f0'; ctx.fillRect(0,0,SIZE,SIZE);
  const cx=SIZE/2, cy=SIZE/2-40;

  // sunburst rays
  const rays=24, rOuter=430, rInner=250;
  ctx.save();
  for(let i=0;i<rays;i++){
    const a0=(i/rays)*Math.PI*2;
    const a1=a0+(Math.PI*2/rays)/2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+rOuter*Math.cos(a0), cy+rOuter*Math.sin(a0));
    ctx.lineTo(cx+rOuter*Math.cos(a1), cy+rOuter*Math.sin(a1));
    ctx.closePath();
    ctx.fillStyle = i%2===0 ? hexToRgba(selectedColor,0.9) : hexToRgba(darken(selectedColor,25),0.9);
    ctx.fill();
  }
  ctx.restore();

  // outer ring
  ctx.beginPath(); ctx.arc(cx,cy,rInner+18,0,Math.PI*2);
  ctx.lineWidth=10; ctx.strokeStyle='#faf7f0'; ctx.stroke();

  // inner circle
  ctx.beginPath(); ctx.arc(cx,cy,rInner,0,Math.PI*2);
  ctx.fillStyle='#fdfbf5'; ctx.fill();
  ctx.lineWidth=8; ctx.strokeStyle=selectedColor; ctx.stroke();

  // laurel-ish dots ring
  ctx.fillStyle=hexToRgba(selectedColor,0.6);
  for(let i=0;i<40;i++){
    const a=(i/40)*Math.PI*2;
    const dx=cx+(rInner-24)*Math.cos(a), dy=cy+(rInner-24)*Math.sin(a);
    ctx.beginPath(); ctx.arc(dx,dy,3,0,Math.PI*2); ctx.fill();
  }

  // ribbon tails at bottom
  function tail(sign){
    ctx.save();
    ctx.translate(cx+sign*70, cy+rInner-10);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(sign*90, 40);
    ctx.lineTo(sign*40, 220);
    ctx.lineTo(0, 190);
    ctx.lineTo(sign*-10,220);
    ctx.lineTo(sign*-40,40);
    ctx.closePath();
    ctx.fillStyle=darken(selectedColor,10);
    ctx.fill();
    ctx.restore();
  }
  tail(-1); tail(1);

  const n=text.length;
  let base = n<=1?300:(n===2?220:(n===3?170:140));
  const innerW=(rInner-40)*2;
  drawStyledText(text, cx, cy, innerW, base, 60);
}

/* ---------- 7. 相片手札 photo upload + caption (full-bleed, no extra decoration) ---------- */
function drawPhoto(text){
  ctx.fillStyle='#e5e1d3'; ctx.fillRect(0,0,SIZE,SIZE);

  if(uploadedImage){
    drawImageCoverZoom(uploadedImage, 0, 0, SIZE, SIZE, imageScale, imageOffsetX, imageOffsetY);
    // soft bottom scrim so caption text stays legible over any photo
    const grad = ctx.createLinearGradient(0, SIZE-360, 0, SIZE);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, SIZE-360, SIZE, 360);
  } else {
    const cx=SIZE/2, cy=SIZE/2-60;
    ctx.save();
    ctx.setLineDash([16,12]); ctx.lineWidth=6; ctx.strokeStyle='#b7ae95';
    roundRectPath(SIZE*0.12, SIZE*0.12, SIZE*0.76, SIZE*0.76, 16); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle='#b7ae95'; ctx.lineWidth=12; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(cx-46,cy); ctx.lineTo(cx+46,cy);
    ctx.moveTo(cx,cy-46); ctx.lineTo(cx,cy+46);
    ctx.stroke();
    ctx.font=`500 32px 'Noto Sans TC'`; ctx.fillStyle='#8f8871';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('點下方「上傳圖片」加入照片', cx, cy+110);
    ctx.restore();
  }

  const n=text.length;
  let base = n<=1?260:(n===2?190:(n===3?150:120));
  const innerW = SIZE-160;
  drawStyledText(text, SIZE/2, SIZE-150, innerW, base, 60);
}

const DRAWERS = { grid:drawGrid, circle:drawCircle, cover:drawCover, stamp:drawStamp, washi:drawWashi, emblem:drawEmblem, photo:drawPhoto };

function draw(){
  const text=(input.value||'字').trim()||'字';
  DRAWERS[currentTemplate](text);
}

/* ---------- UI wiring ---------- */
function buildTabs(){
  const row=document.getElementById('tabRow'); row.innerHTML='';
  Object.keys(TEMPLATES).forEach(key=>{
    const t=document.createElement('div');
    t.className='tab'+(key===currentTemplate?' active':'');
    t.textContent=TEMPLATES[key].label;
    t.addEventListener('click',()=>{
      currentTemplate=key; selectedColor=TEMPLATES[key].colors[0];
      selectedTextColor = (key==='photo') ? TEXT_COLORS[1] : TEXT_COLORS[0];
      textOffsetX=0; textOffsetY=0; textScale=1;
      imageScale=1; imageOffsetX=0; imageOffsetY=0; dragTarget='text';
      const slider=document.getElementById('sizeSlider');
      if(slider){ slider.value=1; document.getElementById('sizeValue').textContent='100%'; }
      const zoomSlider=document.getElementById('imgZoomSlider');
      if(zoomSlider){ zoomSlider.value=1; document.getElementById('imgZoomValue').textContent='100%'; }
      updateDragTabs();
      buildTabs(); buildSwatches(); buildTextColorRow(); toggleUploadSection(); draw();
    });
    row.appendChild(t);
  });
}
function toggleUploadSection(){
  document.getElementById('uploadSection').style.display = (currentTemplate==='photo') ? 'block' : 'none';
}
function buildFontRow(){
  const row=document.getElementById('fontRow'); row.innerHTML='';
  Object.keys(FONTS).forEach(key=>{
    const f=FONTS[key];
    const c=document.createElement('div');
    c.className='font-chip'+(key===selectedFontKey?' selected':'');
    c.style.fontFamily=f.family;
    c.textContent=f.label;
    c.addEventListener('click',()=>{ selectedFontKey=key; buildFontRow(); draw(); });
    row.appendChild(c);
  });
}
function buildTextColorRow(){
  const row=document.getElementById('textColorRow'); row.innerHTML='';
  TEXT_COLORS.forEach(c=>{
    const s=document.createElement('div');
    s.className='swatch text-swatch'+(c===selectedTextColor?' selected':'');
    s.style.background=c;
    s.addEventListener('click',()=>{ selectedTextColor=c; buildTextColorRow(); draw(); });
    row.appendChild(s);
  });
}
function buildSwatches(){
  const row=document.getElementById('swatchRow'); row.innerHTML='';
  TEMPLATES[currentTemplate].colors.forEach(c=>{
    const s=document.createElement('div');
    s.className='swatch'+(c===selectedColor?' selected':'');
    s.style.background=c;
    s.addEventListener('click',()=>{ selectedColor=c; buildSwatches(); draw(); });
    row.appendChild(s);
  });
}

input.addEventListener('input', draw);

function getFileName(){
  const text=(input.value||'字').trim()||'字';
  return `${TEMPLATES[currentTemplate].label}_${text}.png`;
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  canvas.toBlob((blob) => {
    if(!blob){
      statusMsg.textContent = '下載失敗，請改用「預覽並儲存」後長按圖片存檔';
      return;
    }
    try{
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = getFileName();
      link.href = url;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      statusMsg.textContent = '已觸發下載；若手機上沒反應，是瀏覽器/App 內建瀏覽器的限制，請改用「預覽並儲存」後長按圖片存檔';
    }catch(err){
      statusMsg.textContent = '下載失敗，請改用「預覽並儲存」後長按圖片存檔';
    }
  }, 'image/png');
});
document.getElementById('openBtn').addEventListener('click', () => {
  try{
    const dataUrl=canvas.toDataURL('image/png');
    document.getElementById('modalImg').src = dataUrl;
    document.getElementById('imgModal').style.display = 'flex';
  }catch(err){
    statusMsg.textContent='預覽失敗，請再試一次';
  }
});
document.getElementById('closeModalBtn').addEventListener('click', () => {
  document.getElementById('imgModal').style.display = 'none';
});
document.getElementById('imgModal').addEventListener('click', (e) => {
  if(e.target.id === 'imgModal') document.getElementById('imgModal').style.display = 'none';
});

// drag-to-reposition text directly on the canvas
let dragging = false, lastPX = 0, lastPY = 0;
canvas.addEventListener('pointerdown', (e) => {
  dragging = true; lastPX = e.clientX; lastPY = e.clientY;
  canvas.style.cursor = 'grabbing';
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
});
canvas.addEventListener('pointermove', (e) => {
  if(!dragging) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const dx = (e.clientX - lastPX) * scaleX;
  const dy = (e.clientY - lastPY) * scaleY;
  if(currentTemplate === 'photo' && dragTarget === 'image'){
    imageOffsetX += dx; imageOffsetY += dy;
  } else {
    textOffsetX += dx; textOffsetY += dy;
  }
  lastPX = e.clientX; lastPY = e.clientY;
  draw();
});
function endDrag(){ dragging = false; canvas.style.cursor = 'grab'; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

document.getElementById('oneLineTab').addEventListener('click', () => {
  twoLineMode = false;
  document.getElementById('oneLineTab').classList.add('active');
  document.getElementById('twoLineTab').classList.remove('active');
  draw();
});
document.getElementById('twoLineTab').addEventListener('click', () => {
  twoLineMode = true;
  document.getElementById('twoLineTab').classList.add('active');
  document.getElementById('oneLineTab').classList.remove('active');
  draw();
});

document.getElementById('sizeSlider').addEventListener('input', (e) => {
  textScale = parseFloat(e.target.value);
  document.getElementById('sizeValue').textContent = Math.round(textScale*100)+'%';
  draw();
});

document.getElementById('resetPosBtn').addEventListener('click', () => {
  textOffsetX = 0; textOffsetY = 0; textScale = 1;
  const slider=document.getElementById('sizeSlider');
  slider.value=1; document.getElementById('sizeValue').textContent='100%';
  draw();
});

function updateDragTabs(){
  const textTab=document.getElementById('dragTextTab');
  const imgTab=document.getElementById('dragImageTab');
  if(!textTab || !imgTab) return;
  textTab.classList.toggle('active', dragTarget==='text');
  imgTab.classList.toggle('active', dragTarget==='image');
}
document.getElementById('dragTextTab').addEventListener('click', () => { dragTarget='text'; updateDragTabs(); });
document.getElementById('dragImageTab').addEventListener('click', () => { dragTarget='image'; updateDragTabs(); });

document.getElementById('imgZoomSlider').addEventListener('input', (e) => {
  imageScale = parseFloat(e.target.value);
  document.getElementById('imgZoomValue').textContent = Math.round(imageScale*100)+'%';
  draw();
});

document.getElementById('uploadBtn').addEventListener('click', () => {
  document.getElementById('imageInput').click();
});
document.getElementById('imageInput').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => { uploadedImage = img; draw(); statusMsg.textContent = '圖片已套用'; };
    img.onerror = () => { statusMsg.textContent = '圖片讀取失敗，請換一張再試'; };
    img.src = ev.target.result;
  };
  reader.onerror = () => { statusMsg.textContent = '圖片讀取失敗，請換一張再試'; };
  reader.readAsDataURL(file);
});
document.getElementById('removeImgBtn').addEventListener('click', () => {
  uploadedImage = null;
  imageScale = 1; imageOffsetX = 0; imageOffsetY = 0;
  const zoomSlider=document.getElementById('imgZoomSlider');
  if(zoomSlider){ zoomSlider.value=1; document.getElementById('imgZoomValue').textContent='100%'; }
  document.getElementById('imageInput').value = '';
  draw();
  statusMsg.textContent = '已移除圖片';
});

buildTabs(); buildFontRow(); buildTextColorRow(); buildSwatches(); toggleUploadSection(); updateDragTabs();
if(document.fonts && document.fonts.ready){
  Promise.all([
    document.fonts.load("900 500px 'Noto Serif TC'"),
    document.fonts.load("700 400px 'Noto Sans TC'"),
    document.fonts.load("400 400px 'LXGW WenKai TC'"),
    document.fonts.load("400 400px 'cwTeXYen'"),
    document.fonts.load("400 400px 'cwTeXKai'"),
    document.fonts.load("400 400px 'cwTeXMing'")
  ]).then(draw).catch(draw);
} else {
  draw();
}
</script>
